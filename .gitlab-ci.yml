variables:
  RUST_VERSION: "1.86"
  GO_VERSION: "1.26.0"
  GLIBC_VERSION: "2.36"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  GO_TAGS: "coraza.rule.rx_prefilter,coraza.rule.multiphase_evaluation,coraza.rule.no_regex_multiline"

stages:
  - check
  - build
  - e2e
  - release

# Shared script to install Go in Rust-based images
.install-go: &install-go
  - curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
  - export PATH="/usr/local/go/bin:$PATH"

# --- Check stage ---

fmt:
  stage: check
  image: rust:${RUST_VERSION}
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check
  except:
    - tags

clippy:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  before_script:
    - *install-go
    - rustup component add clippy
  script:
    - cargo clippy -- -D warnings
  except:
    - tags

go-vet:
  stage: check
  image: golang:${GO_VERSION}-bookworm
  script:
    - cd go
    - go vet -tags "${GO_TAGS}" ./...
  except:
    - tags

test:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  before_script:
    - *install-go
  script:
    - cd go && go test -v -tags "${GO_TAGS}" -count=1 ./...
    - cd ..
    - cargo test --workspace
  only:
    - main
    - merge_requests
    - branches

bench:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  before_script:
    - *install-go
  script:
    - cargo bench
  artifacts:
    paths:
      - target/criterion/
    expire_in: 1 week
  only:
    - main

# --- Build stage ---

build-amd64:
  stage: build
  image: rust:${RUST_VERSION}-bookworm
  variables:
    ARCH: amd64
  before_script:
    - *install-go
  script:
    - cargo build --release
    - cp target/release/libcoraza_plugin.so libcoraza_plugin-${ARCH}-glibc${GLIBC_VERSION}.so
  artifacts:
    paths:
      - libcoraza_plugin-${ARCH}-glibc${GLIBC_VERSION}.so
  only:
    - main
    - tags

build-arm64:
  stage: build
  image: rust:${RUST_VERSION}-bookworm
  variables:
    ARCH: arm64
  before_script:
    - apt-get update && apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    - curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
    - export PATH="/usr/local/go/bin:$PATH"
    - rustup target add aarch64-unknown-linux-gnu
  script:
    - cargo build --release --target aarch64-unknown-linux-gnu
    - cp target/aarch64-unknown-linux-gnu/release/libcoraza_plugin.so libcoraza_plugin-${ARCH}-glibc${GLIBC_VERSION}.so
  artifacts:
    paths:
      - libcoraza_plugin-${ARCH}-glibc${GLIBC_VERSION}.so
  only:
    - main
    - tags

build-armv7:
  stage: build
  image: rust:${RUST_VERSION}-bookworm
  variables:
    ARCH: armv7
  before_script:
    - apt-get update && apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
    - curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
    - export PATH="/usr/local/go/bin:$PATH"
    - rustup target add armv7-unknown-linux-gnueabihf
  script:
    - cargo build --release --target armv7-unknown-linux-gnueabihf
    - cp target/armv7-unknown-linux-gnueabihf/release/libcoraza_plugin.so libcoraza_plugin-${ARCH}-glibc${GLIBC_VERSION}.so
  artifacts:
    paths:
      - libcoraza_plugin-${ARCH}-glibc${GLIBC_VERSION}.so
  only:
    - main
    - tags

# --- E2E stage ---

e2e:
  stage: e2e
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache bash curl kubectl
    - curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64 && chmod +x /usr/local/bin/kind
  script:
    - cd tests/e2e && bash run.sh
  only:
    - main
    - merge_requests

# --- Release stage ---

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "libcoraza_plugin-amd64-glibc${GLIBC_VERSION}.so"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/libcoraza_plugin-amd64-glibc${GLIBC_VERSION}.so?job=build-amd64"
        - name: "libcoraza_plugin-arm64-glibc${GLIBC_VERSION}.so"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/libcoraza_plugin-arm64-glibc${GLIBC_VERSION}.so?job=build-arm64"
        - name: "libcoraza_plugin-armv7-glibc${GLIBC_VERSION}.so"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/libcoraza_plugin-armv7-glibc${GLIBC_VERSION}.so?job=build-armv7"
  only:
    - tags
