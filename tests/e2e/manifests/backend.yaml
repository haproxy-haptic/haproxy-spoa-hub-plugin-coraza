apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: e2e-coraza
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: e2e-coraza
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
