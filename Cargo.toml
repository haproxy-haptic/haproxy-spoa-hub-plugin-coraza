[package]
name = "coraza-plugin"
version = "0.11.0"
edition = "2024"
rust-version = "1.86"
description = "Coraza WAF plugin for haproxy-spoa-hub"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["go-backend"]
go-backend = []
rust-backend = ["dep:zentinel-modsec", "dep:tempfile", "dep:tar", "dep:flate2", "dep:sha2", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
zentinel-modsec = { git = "https://github.com/phihos/zentinel-modsec", rev = "b206f2fb39d854628e755f95a0afdfb2d7ee1576", default-features = false, optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }
tempfile = { version = "3", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

# Requires plugin-api 0.6.0+ for the v2 vtable that carries
# set_metric_recorder. Plugin loads on v0.5.x hubs too — the v2
# vtable field is appended after v1, so v0.5.x hubs read only what
# they know and the metric-recorder install becomes a no-op.
# Keep the crates.io version for release builds. During coordinated development
# this path points at the source of the compatible 0.7.1 macro fix; it is
# reverted to `"0.7.1"` before commit once that crate is published.
haproxy-spoa-hub-plugin-api = "0.8.0"
glob = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "waf_bench"
harness = false
required-features = ["go-backend"]

[profile.release]
lto = true
codegen-units = 1

[[bench]]
name = "evaluation_ffi"
harness = false
required-features = ["go-backend"]

[[test]]
name = "ffi_test"
required-features = ["go-backend"]
