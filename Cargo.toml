[package]
name = "coraza-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Coraza WAF plugin for haproxy-spoa-hub"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
haproxy-spoa-hub-plugin-api = "0.1"
abi_stable = "0.11"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "waf_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
