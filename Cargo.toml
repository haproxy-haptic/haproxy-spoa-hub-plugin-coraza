[package]
name = "coraza-plugin"
version = "0.10.0"
edition = "2024"
rust-version = "1.86"
description = "Coraza WAF plugin for haproxy-spoa-hub"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Requires plugin-api 0.6.0+ for the v2 vtable that carries
# set_metric_recorder. Plugin loads on v0.5.x hubs too — the v2
# vtable field is appended after v1, so v0.5.x hubs read only what
# they know and the metric-recorder install becomes a no-op.
# Keep the crates.io version for release builds. During coordinated development
# this path points at the source of the compatible 0.7.1 macro fix; it is
# reverted to `"0.7.1"` before commit once that crate is published.
haproxy-spoa-hub-plugin-api = "0.7.1"
glob = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "waf_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
