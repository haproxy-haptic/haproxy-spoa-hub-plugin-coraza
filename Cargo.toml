[package]
name = "coraza-plugin"
version = "0.4.2"
edition = "2024"
rust-version = "1.86"
description = "Coraza WAF plugin for haproxy-spoa-hub"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Requires plugin-api 0.5.0+ (the hand-rolled #[repr(C)] vtable
# migration). This plugin will not load on hubs older than v0.5.0.
haproxy-spoa-hub-plugin-api = "0.5"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "waf_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
