name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign, and verify without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-*
          path: artifacts/
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: scripts/sign-release-artifacts.sh
      - name: Verify signatures
        run: |
          identity="https://github.com/${REPO}/.github/workflows/release.yml@${GITHUB_REF}"
          cd artifacts
          for f in *.so; do
            cosign verify-blob "$f" \
              --bundle "$f.cosign.bundle" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Write SHA256SUMS
        run: |
          cd artifacts
          : > SHA256SUMS
          for f in *; do
            case "$f" in
              *.sha256 | *.cosign.bundle | SHA256SUMS) continue ;;
            esac
            sha256sum "$f" >> SHA256SUMS
          done
          sha256sum --check SHA256SUMS
          for f in *.sha256; do sha256sum --check "$f"; done
          ls -l
      - name: Release notes
        run: |
          VERSION="${TAG#v}"
          awk -v ver="${VERSION}" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${TAG}" > release-notes.md
          fi
          cat release-notes.md
      - name: Create release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --repo "${REPO}" --title "$GITHUB_REF_NAME" --notes-file release-notes.md artifacts/*
